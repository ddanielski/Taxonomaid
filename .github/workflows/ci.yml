name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, type, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-suffix: ci

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -r src/taxonomaid -c pyproject.toml

      - name: Import-linter
        run: uv run lint-imports

      - name: Pytest with coverage
        run: uv run pytest -m "unit or integration" --cov --cov-report=xml --cov-report=term

      # Don't fail CI if Codecov has a hiccup - the pytest step above
      # already prints coverage to the job log.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: MkDocs strict build
        run: uv run mkdocs build --strict

      - name: Verify uv.lock is up to date
        run: uv lock --check
