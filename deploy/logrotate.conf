# Logrotate snippet for taxonomaid's JSONL audit logs.
#
# Drop into /etc/logrotate.d/taxonomaid (system) or chain into a user
# logrotate via:
#
#     logrotate --state ~/.local/share/taxonomaid/logrotate.state \
#               /path/to/this/file
#
# Defaults below are sized for a personal NAS workload (handful of
# events per day). Bump `weekly` to `daily` or lower `size` if you
# trigger thousands of decisions per day.
#
# `taxonomaid` does **not** detect rotated files; the dispatcher's
# similarity warm-up only reads the current `decisions.jsonl`. After
# rotation, the in-memory similarity index repopulates from new
# decisions as they arrive - exactly the behaviour you want for
# "archive the old, train on the new". The miner's `--data-dir`
# argument can be pointed at the historical archive directory if
# you want to mine across rotations.

/path/to/data/decisions.jsonl
/path/to/data/pending_decisions.jsonl
{
    weekly
    rotate 12
    size 50M
    compress
    delaycompress
    notifempty
    missingok
    # The daemon holds file descriptors open under flock; use
    # copytruncate so logrotate doesn't break those file handles.
    copytruncate
    # No `create` directive: copytruncate preserves the original
    # file's mode/owner/group.
}
