# Sample Docker Compose deployment for a NAS.
#
# Secrets workflow
# ----------------
# Two of the three pieces of secret material - the Gemini API key and
# the Telegram bot token - are passed as Docker secrets. The chat ID
# isn't a secret (knowing it doesn't let an attacker do anything
# without the bot token) so it stays as a plain env var.
#
# Setup:
#   mkdir -p secrets
#   printf '%s' '<your-gemini-key>'      > secrets/gemini_api_key.txt
#   printf '%s' '<your-telegram-token>'  > secrets/telegram_bot_token.txt
#   chmod 600 secrets/*
#
#   $EDITOR compose.yaml             # set TELEGRAM_CHAT_ID, bind paths
#   docker compose up -d
#
# The image follows the standard ``*_FILE`` convention: any
# environment variable ending in ``_FILE`` is consumed at startup
# and exposed under the suffix-stripped name with the file's
# contents as its value.
#
# UID/GID
# -------
# The image's default user is ``uid=1000:gid=1000`` (Linux
# convention for the first non-root user). On a NAS where this
# doesn't match the owner of your watched folders, set ``PUID``
# and ``PGID`` in ``.env`` and the ``user:`` override below picks
# them up:
#
#   # .env
#   PUID=1026
#   PGID=100
#
# That works with the prebuilt GHCR image - no rebuild required.
# If you specifically need ``/app`` to also be owned by your UID
# (rare; the daemon doesn't write there), uncomment the
# ``build.args`` block to bake the UID/GID into the image at
# build time.

services:
  taxonomaid:
    # Production deployments pull the published image from GHCR -
    # ``docker compose pull && docker compose up -d`` is enough on
    # the NAS, no build context required. Pin to a version tag in
    # production (e.g. ``:0.1.3``) so a fresh ``latest`` push doesn't
    # silently update your daemon.
    image: ghcr.io/ddanielski/taxonomaid:latest
    # local-build path: uncomment ``build:`` to rebuild
    # from the working tree on every ``docker compose up`` instead
    # of pulling. The ``args`` block bakes your host's UID/GID into
    # the image so /app is owned by the right user; for most
    # deployments the ``user:`` override below is enough.
    # build:
    #   context: .
    #   args:
    #     UID: ${PUID:-1000}
    #     GID: ${PGID:-1000}
    container_name: taxonomaid
    restart: unless-stopped
    # Runtime UID/GID override. ``${PUID}`` and ``${PGID}`` are
    # read from ``.env`` (or the host environment); the ``:-1000``
    # fallback keeps the image runnable without one.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Plaintext: the chat ID is not a credential.
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
      # ``*_FILE`` indirection: the daemon reads each path at startup
      # and exposes the contents under the suffix-stripped name.
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - gemini_api_key
      - telegram_bot_token
    volumes:
      # `:rw` so `mine` / `review` can update proposed_rules.yaml etc.
      - ./config:/config:rw
      - ./data:/data
      # Edit this to point at the directory you actually want organised.
      - /volume1/docs:/volume1/docs:rw
    # The Dockerfile already declares HEALTHCHECK ["taxonomaid", "health"]
    # so we don't override it here.

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
