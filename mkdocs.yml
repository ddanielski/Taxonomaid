site_name: Taxonomaid
site_description: Hybrid auto-sorter for shared folders that learns LLM decisions back into rules.
site_url: https://ddanielski.github.io/Taxonomaid/
repo_url: https://github.com/ddanielski/Taxonomaid
repo_name: danielski/Taxonomaid

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - Architecture: architecture.md
  - Architecture Decision Records:
      - adr/index.md
      - "0001 - Hexagonal layering": adr/0001-hexagonal-layering.md
  - API reference:
      - reference/index.md
      - Domain: reference/domain.md
      - Ports: reference/ports.md
      - Services: reference/services.md
      - Adapters: reference/adapters.md
      - Config: reference/config.md
      - Bootstrap: reference/bootstrap.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
